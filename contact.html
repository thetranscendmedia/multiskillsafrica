

    <main>
        <!-- Contact Page Hero Section -->
        <section>
            <h1>Get in Touch</h1>
            <p>Whether you're a funder, partner, school, journalist, or simply want to know more we'd love to hear from you.</p>
        </section>

        <!-- Contact Form Section -->
        <section>
            <form action="#" method="POST">
                
                <!-- Full Name Field -->
                <div>
                    <label for="full-name">Full Name *</label>
                    <input type="text" id="full-name" name="full_name" required>
                </div>

                <!-- Email Address Field -->
                <div>
                    <label for="email-address">Email Address *</label>
                    <input type="email" id="email-address" name="email_address" required>
                </div>

                <!-- Organisation Field -->
                <div>
                    <label for="organisation">Organisation</label>
                    <input type="text" id="organisation" name="organisation">
                </div>

                <!--  Dropdown Section for about dmedia-->
                <div>
                    <label for="subject">Subject</label>
                    <select id="subject" name="subject" required>
                        <option value="" disabled selected>Select a subject...</option>
                        <option value="General Enquiry">General Enquiry</option>
                        <option value="Partnership">Partnership</option>
                        <option value="Donation">Donation</option>
                        <option value="Press & Media">Press & Media</option>
                        <option value="School Participation">School Participation</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <!-- Message Field -->
                <div>
                    <label for="message">Message *</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <!-- Submit Button -->
                <div>
                    <button type="submit">Send Message</button>
                </div>

            </form>

            
    </main>

</body>
</html>
