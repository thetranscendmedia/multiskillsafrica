<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latest Updates | MultiSkillsAfrica</title>
    <!-- Linked CSS File -->
    <link rel="stylesheet" href="blog.css">
</head>
<body>

    <!-- Dynamic Blog Section -->
    <section class="blog-section" id="updates-log">
        <div class="blog-container">
            
            <div class="blog-header">
                <span class="section-tagline">STAY UPDATED</span>
                <h2>Project Logs & Announcements</h2>
                <p>Follow the latest milestones, stories, and training updates directly from the MultiSkillsAfrica team.</p>
            </div>

            <!-- The Grid Target for dynamic logs -->
            <div id="mstp-log-feed" class="log-grid">
                <div class="log-loading">
                    <div class="spinner"></div>
                    <p>Fetching latest updates from live feed...</p>
                </div>
            </div>

        </div>
    </section>

    <!-- Background Engine -->
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        const bloggerUrl = "https://multiskillafrica.blogspot.com"; 

        // Premium fallbacks so the page is alive instantly while empty
        const fallbackTemplates = `
            <article class="log-card" style="animation-delay: 0.1s;">
                <div class="card-meta"><span class="card-date">July 2026</span></div>
                <h3 class="card-title">Welcome to the MultiSkillsAfrica Log</h3>
                <p class="card-snippet">This section will host live field reports, newly launched educational modules, and program announcements managed directly by our team.</p>
                <a href="${bloggerUrl}" target="_blank" class="card-link">Visit Dashboard <span class="arrow">→</span></a>
            </article>
            <article class="log-card" style="animation-delay: 0.2s;">
                <div class="card-meta"><span class="card-date">July 2026</span></div>
                <h3 class="card-title">Vocational Module Updates</h3>
                <p class="card-snippet">Keep track of updates regarding our core pillars, training frameworks, and community development pilots across tracking regions.</p>
                <a href="${bloggerUrl}" target="_blank" class="card-link">Visit Dashboard <span class="arrow">→</span></a>
            </article>
            <article class="log-card" style="animation-delay: 0.3s;">
                <div class="card-meta"><span class="card-date">July 2026</span></div>
                <h3 class="card-title">Empowering Growth through Tech</h3>
                <p class="card-snippet">Read summaries of recent hackathons, technical tools acquired by training hubs, and participant achievement tracking statistics.</p>
                <a href="${bloggerUrl}" target="_blank" class="card-link">Visit Dashboard <span class="arrow">→</span></a>
            </article>
        `;

        fetch(`${bloggerUrl}/feeds/posts/default?alt=json`)
          .then(response => {
              if (!response.ok) throw new Error('No entries found yet');
              return response.json();
          })
          .then(data => {
              const entries = data.feed.entry || [];
              const feedContainer = document.getElementById("mstp-log-feed");
              let htmlContent = "";
              
              if(entries.length === 0) {
                  feedContainer.innerHTML = fallbackTemplates;
                  return;
              }
              
              entries.slice(0, 3).forEach((entry, index) => {
                  const title = entry.title.$t;
                  let rawContent = entry.content.$t;
                  
                  let cleanText = rawContent.replace(/<img[^>]*>/g, "").replace(/<[^>]*>/g, ""); 
                  let snippet = cleanText.substring(0, 140) + (cleanText.length > 140 ? "..." : "");
                  
                  const published = new Date(entry.published.$t).toLocaleDateString('en-US', {
                      month: 'short', day: 'numeric', year: 'numeric'
                  });
                  
                  const postLink = entry.link.find(l => l.rel === 'alternate').href;
                  
                  // Incremental animation-delay added per card via style attribute
                  htmlContent += `
                      <article class="log-card" style="animation-delay: ${0.1 * (index + 1)}s;">
                          <div class="card-meta"><span class="card-date">${published}</span></div>
                          <h3 class="card-title">${title}</h3>
                          <p class="card-snippet">${snippet}</p>
                          <a href="${postLink}" target="_blank" class="card-link">Read Full Post <span class="arrow">→</span></a>
                      </article>
                  `;
              });
              
              feedContainer.innerHTML = htmlContent;
          })
          .catch(error => {
              document.getElementById("mstp-log-feed").innerHTML = fallbackTemplates;
          });
    });
    </script>
</body>
</html>
